<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Midas Talent Match</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand-mark">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0d077" />
            <stop offset="1" stop-color="#a8841f" />
          </linearGradient>
        </defs>
        <circle cx="20" cy="20" r="8" fill="url(#goldGrad)" />
        <circle cx="44" cy="20" r="8" fill="url(#goldGrad)" />
        <circle cx="32" cy="16" r="10" fill="url(#goldGrad)" />
        <path d="M6 46c0-8 8-13 14-13s14 5 14 13z" fill="url(#goldGrad)" />
        <path d="M30 46c0-9 9-15 16-15s16 6 16 15z" fill="url(#goldGrad)" transform="translate(-4,0)" />
      </svg>
    </div>
    <h1>Midas Talent Match</h1>
    <div class="tagline">Job Platform</div>
    <div id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" style="width:100%">Masuk</button>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('err');
    errBox.innerHTML = '';
    try {
      const { user } = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      window.location.href = user.role === 'admin' ? '/admin.html' : '/freelancer.html';
    } catch (err) {
      errBox.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
